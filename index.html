<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOCIAL MEDIA PLATFORM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f0f2f5}
nav{background:white;padding:14px 4%;display:flex;justify-content:space-between;box-shadow:0 2px 8px #0002;position:sticky;top:0;z-index:10}
.logo{color:#1877f2;font-weight:bold;font-size:26px}
.main{max-width:700px;margin:20px auto;padding:0 12px}
.card{background:white;border-radius:16px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:14px;margin:8px 0;border:2px solid #eee;border-radius:10px;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:#1877f2}
.btn{background:#1877f2;color:white;border:none;padding:14px;width:100%;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer}
.tag{display:inline-block;padding:6px 12px;border-radius:20px;color:white;font-size:12px;margin:3px;font-weight:bold}
.db{background:#764ba2} .feat{background:#00a2ff}
.post-img{width:100%;border-radius:12px;margin:10px 0;max-height:380px;object-fit:cover}
.action{border:none;background:none;font-weight:bold;font-size:17px;color:#65676b;cursor:pointer;margin-right:20px}
.liked{color:#1877f2!important}
.hidden{display:none}
</style>
</head>
<body>

<div id="loginBox" class="card" style="max-width:450px;margin:80px auto;text-align:center">
  <h1 style="color:#1877f2;font-size:36px">Social Media platform</h1>
  <p>SOCIAL MEDIA</p><br>
  <input id="name" placeholder="Name (User Profile)">
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password (for JWT Auth)">
  <button class="btn" onclick="register()">Create Profile / Login</button>
  
  <div style="margin-top:20px;background:#f8f9ff;padding:12px;border-radius:12px;border:1px dashed #1877f2;text-align:left">
    <div style="font-weight:bold;font-size:12px">📦 DATABASE ARCHITECTURE</div>
    <span class="tag db">users</span><span class="tag db">posts</span><span class="tag db">comments</span><span class="tag db">followers</span>
    <div style="font-weight:bold;font-size:12px;margin-top:8px">✨ CORE FEATURES</div>
    <span class="tag feat">Profile</span><span class="tag feat">Posts</span><span class="tag feat">Like System</span><span class="tag feat">Follow System</span>
  </div>
  <p style="font-size:11px;color:#888;margin-top:10px">Database: database.json | Backend: Express.js | JWT Auth | Frontend: HTML CSS JS</p>
</div>

<div id="app" class="hidden">
<nav><div class="logo">SociaBook</div><div><b id="uName"></b> | <span id="fCount">Followers: 0</span> | <span onclick="logout()" style="color:red;cursor:pointer;margin-left:10px;font-weight:bold">Logout</span></div></nav>
<div class="main">
  <div class="card">
    <textarea id="postText" placeholder="What's on your mind? (Create Posts)"></textarea>
    <input id="postImg" placeholder="Image URL optional">
    <button class="btn" onclick="createPost()">Post</button>
  </div>
  <div id="posts"></div>
</div>
</div>

<script>
// ===== DATABASE (database.json) SIMULATION =====
let DB = JSON.parse(localStorage.getItem('socialDB') || '{"users":[],"posts":[{"id":1,"user":"Engineering Social Network","userId":0,"text":"Stack Social Media Platform - Profile, Posts, Like, Follow","img":"https://images.unsplash.com/photo-1611162616805-1c844a9979d5?w=600","likes":[],"comments":[],"followers":[]}]}');
function save(){ localStorage.setItem('socialDB', JSON.stringify(DB)); }

let currentUser = JSON.parse(localStorage.getItem('jwtUser') || 'null');
let token = localStorage.getItem('jwtToken');

if(currentUser){ showApp(); }

function register(){
  let name=document.getElementById('name').value;
  let email=document.getElementById('email').value;
  let pass=document.getElementById('pass').value;
  if(!name||!email||!pass) return alert("");
  // JWT Token create (simulated)
  let user = {id:Date.now(), name, email, followers:[], following:[]};
  DB.users.push(user); save();
  let jwtToken = btoa(JSON.stringify(user))+".JWT.CODEALPHA"; // JWT Login Authentication
  localStorage.setItem('jwtToken', jwtToken);
  localStorage.setItem('jwtUser', JSON.stringify(user));
  currentUser=user; showApp();
}
function showApp(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('uName').innerText=currentUser.name;
  render();
}
function logout(){ localStorage.clear(); location.reload(); }

function createPost(){
  let text=document.getElementById('postText').value;
  let img=document.getElementById('postImg').value;
  if(!text && !img) return alert("Kuch likho");
  DB.posts.unshift({id:Date.now(), user:currentUser.name, userId:currentUser.id, text, img, likes:[], comments:[]});
  save(); document.getElementById('postText').value=""; document.getElementById('postImg').value=""; render();
}
function render(){
  let html="";
  DB.posts.forEach(p=>{
    let liked = p.likes.includes(currentUser.id);
    html+=`<div class="card">
      <div style="display:flex;justify-content:space-between"><b style="font-size:20px">${p.user} (User Profile)</b>
      <button onclick="follow(${p.userId})" style="border:2px solid #1877f2;color:#1877f2;background:white;padding:6px 14px;border-radius:8px;font-weight:bold;cursor:pointer">${currentUser.following && currentUser.following.includes(p.userId)?'Following':'Follow'}</button></div>
      <p style="margin:10px 0;font-size:18px">${p.text}</p>
      ${p.img?`<img src="${p.img}" class="post-img">`:""}
      <div style="border-top:1px solid #eee;padding-top:10px">
        <button class="action ${liked?'liked':''}" onclick="like(${p.id})">👍 Like (${p.likes.length}) - Like/Unlike</button>
        <button class="action" onclick="document.getElementById('c-${p.id}').focus()">💬 Comments (${p.comments.length})</button>
      </div>
      <div style="background:#f0f2f5;padding:10px;border-radius:10px;margin-top:10px">
        ${p.comments.map(c=>`<div style="margin:5px 0"><b>${c.user}:</b> ${c.text}</div>`).join('')}
        <div style="display:flex;gap:6px;margin-top:8px"><input id="c-${p.id}" placeholder="Write comment..."><button onclick="comment(${p.id})" style="background:#1877f2;color:white;border:none;padding:0 18px;border-radius:20px;font-weight:bold;cursor:pointer">Post</button></div>
      </div>
    </div>`;
  });
  document.getElementById('posts').innerHTML=html;
}
function like(id){
  let p=DB.posts.find(x=>x.id==id);
  if(p.likes.includes(currentUser.id)) p.likes=p.likes.filter(x=>x!=currentUser.id);
  else p.likes.push(currentUser.id);
  save(); render();
}
function comment(id){
  let inp=document.getElementById('c-'+id);
  if(!inp.value) return;
  let p=DB.posts.find(x=>x.id==id);
  p.comments.push({user:currentUser.name, text:inp.value});
  save(); render();
}
function follow(uid){
  if(uid==currentUser.id || uid==0) return alert("Khud ko follow nahi kar sakte");
  let me = DB.users.find(u=>u.id==currentUser.id);
  let other = DB.users.find(u=>u.id==uid);
  if(!me || !other) return alert("User nahi mila");
  if(!me.following) me.following=[];
  if(!other.followers) other.followers=[];
  if(me.following.includes(uid)){ me.following=me.following.filter(x=>x!=uid); other.followers=other.followers.filter(x=>x!=currentUser.id); }
  else { me.following.push(uid); other.followers.push(currentUser.id); }
  currentUser=me; localStorage.setItem('jwtUser', JSON.stringify(me));
  document.getElementById('fCount').innerText="Followers: "+(other.followers.length);
  save(); render();
}
</script>

Database: database.json -> users, posts, comments, <
--> -->
</body>
</html>
